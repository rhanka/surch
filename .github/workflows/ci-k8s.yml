# Surch — K8s burst-bench CI/CD.
#
# Runs heavy CI gates (BEIR NDCG@10, INSEE paired bench) on the Scaleway
# Kapsule "burst" pool described in poc-k8s (rhanka/poc-k8s#2). Every Job
# is short-lived: pool scales 0 -> 1 -> 0, hard 30 min cap. Everything in
# this file is dormant until poc-k8s PR #2 ships the surch namespace + the
# OIDC IAM role; the top-level `if: false` keeps the workflow non-blocking.
#
# Cost guardrails (documentation-only here, enforced inside the Job
# manifests via `activeDeadlineSeconds` and the trap in the burst pool
# tear-down step):
#   SCW_MAX_COST_EUR=2  — DEV1-L node-hour ~0.08€, 30 min run ~0.04€,
#                         leaves a 50x safety margin.
#   SCW_MAX_DURATION_MIN=30 — Jobs carry activeDeadlineSeconds=1800.

name: ci-k8s

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job manifest to run (ndcg-gate | insee-bench | 00-init-corpora)"
        required: true
        default: "ndcg-gate"
        type: choice
        options:
          - ndcg-gate
          - insee-bench
          - 00-init-corpora
  # TODO: enable PR trigger once the burst pool + ghcr-pull Secret are live.
  # pull_request:
  #   types: [opened, synchronize]
  #   paths:
  #     - "crates/**"
  #     - "deploy/k8s/**"
  #     - ".github/workflows/ci-k8s.yml"

env:
  # Cost guardrails — informational at the workflow level; enforced for
  # real by the burst-pool tear-down step + the Job activeDeadlineSeconds.
  SCW_MAX_COST_EUR: "2"
  SCW_MAX_DURATION_MIN: "30"
  SCW_REGION: fr-par
  SCW_ZONE: fr-par-2
  SCW_CLUSTER: poc
  SCW_NAMESPACE: surch
  SCW_BURST_POOL: burst
  GHCR_IMAGE: ghcr.io/rhanka/surch

# MVP: workflow is dormant until poc-k8s PR #2 merges and the OIDC role is
# provisioned. Two jobs:
#   - placeholder: always runs, echoes the inputs (visible feedback in GHA UI)
#   - bench-k8s:   the real worker, gated `if: false` until the cluster is live
# GitHub Actions does not support a workflow-level `if`; gating each
# real job with `if: false` is the canonical way to keep the file
# committed but inert. Flip both `if: false` to `if: ${{ true }}` (or
# remove the line) when activating.
jobs:
  placeholder:
    name: ci-k8s dormant (poc-k8s PR #2 pending)
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    steps:
      - name: Announce dormant state
        run: |
          echo "ci-k8s workflow is dormant: the real bench job is gated 'if: false'."
          echo "Activate after poc-k8s PR #2 merges + ghcr-pull Secret is provisioned."
          echo "Requested job manifest : ${{ inputs.job }}"
          echo "Cost cap : ${SCW_MAX_COST_EUR}€"
          echo "Duration cap : ${SCW_MAX_DURATION_MIN}m"

  bench-k8s:
    if: false  # FLIP THIS once the burst pool + OIDC role + ghcr-pull Secret exist.
    name: surch burst bench (${{ inputs.job }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35  # hard cap = SCW_MAX_DURATION_MIN + 5 min slack
    permissions:
      contents: read
      id-token: write    # required for GitHub -> Scaleway OIDC federation
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image SHA
        id: image
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Step 1 — Auth: GitHub OIDC -> Scaleway IAM short-lived token.
      # ----------------------------------------------------------------
      # TODO: configure SCW_OIDC_ROLE once tenant is live. The IAM role
      # must grant: k8s:read-cluster-kubeconfig on cluster `poc`, plus
      # k8s:pool-update on pool `burst` for scale-up/scale-down.
