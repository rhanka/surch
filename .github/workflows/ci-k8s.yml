      #       | jq -r --arg n "$SCW_BURST_POOL" '.[] | select(.name==$n) | .id')
      #     scw k8s pool update "$POOL_ID" min-size=0 max-size=0

      - name: Dormant placeholder
        run: |
          echo "bench-k8s is gated 'if: false' — this step never runs."
          echo "Selected job manifest : ${{ inputs.job }}"
          echo "Image : ${{ steps.image.outputs.image }}"
          echo "Cost cap : ${SCW_MAX_COST_EUR}€   Duration cap : ${SCW_MAX_DURATION_MIN}m"
