# Surch — K8s burst-bench CI/CD.
#
# Runs heavy CI gates (BEIR NDCG@10, INSEE paired bench) on the Scaleway
# Kapsule burst pool described in poc-k8s (rhanka/poc-k8s#2 + #6
# amendment). Every Job is short-lived; the burst pool autoscales 0 → 1
# → 0 on its own (declared `autoscaling=true` on the pool, no manual
# pool resize from this workflow). Hard 30 min cap is enforced inside
# each Job manifest via `activeDeadlineSeconds: 1800`.
#
# Cost guardrails (documentation-only at the workflow level, real
# enforcement inside the Job manifests):
#   SCW_MAX_COST_EUR=2  — DEV1-L node-hour ~0.08 €, 30 min ~0.04 €,
#                         leaves a 50× safety margin.
#   SCW_MAX_DURATION_MIN=30 — Jobs carry activeDeadlineSeconds=1800.

name: ci-k8s

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job manifest to run (ndcg-gate | insee-bench | 00-init-corpora)"
        required: true
        default: "ndcg-gate"
        type: choice
        options:
          - ndcg-gate
          - insee-bench
          - 00-init-corpora

env:
  SCW_MAX_COST_EUR: "2"
  SCW_MAX_DURATION_MIN: "30"
  SCW_NAMESPACE: surch
  GHCR_IMAGE: ghcr.io/rhanka/surch

jobs:
  bench-k8s:
    name: surch burst bench (${{ inputs.job }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image SHA
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret in either raw YAML or base64-encoded form.
          if printf '%s' "$KUBE_CONFIG_DATA" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl get namespace "$SCW_NAMESPACE"

      - name: Render Job manifest with current SHA
        run: |
          mkdir -p target/k8s
          export SURCH_SHA="${{ steps.image.outputs.sha }}"
          envsubst < "deploy/k8s/jobs/${{ inputs.job }}.yaml" \
            > "target/k8s/${{ inputs.job }}.yaml"
          cat "target/k8s/${{ inputs.job }}.yaml"

      - name: Apply Job manifest
        run: |
          kubectl -n "$SCW_NAMESPACE" apply -f "target/k8s/${{ inputs.job }}.yaml"

      - name: Resolve Job name
        id: jobname
        run: |
          JOB_NAME=$(grep -m1 '^  name:' "target/k8s/${{ inputs.job }}.yaml" | awk '{print $2}')
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "Job name resolved: $JOB_NAME"

      - name: Wait for Job completion (30 min cap)
        run: |
          kubectl -n "$SCW_NAMESPACE" wait \
            --for=condition=Complete \
            --timeout=1800s \
            "job/${{ steps.jobname.outputs.name }}" \
          || kubectl -n "$SCW_NAMESPACE" wait \
            --for=condition=Failed \
            --timeout=10s \
            "job/${{ steps.jobname.outputs.name }}"

      - name: Collect logs + report
        if: always()
        run: |
          mkdir -p target/bench-reports/k8s
          POD=$(kubectl -n "$SCW_NAMESPACE" get pod \
            -l "app.kubernetes.io/component=${{ inputs.job }}" \
            -o jsonpath='{.items[0].metadata.name}' || true)
          if [ -n "$POD" ]; then
            kubectl -n "$SCW_NAMESPACE" logs "$POD" \
              > "target/bench-reports/k8s/${{ inputs.job }}.log" || true
            kubectl -n "$SCW_NAMESPACE" cp \
              "${POD}:/reports/bench.json" \
              "target/bench-reports/k8s/${{ inputs.job }}.json" 2>/dev/null || true
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-bench-${{ inputs.job }}-${{ steps.image.outputs.sha }}
          path: target/bench-reports/k8s/

      - name: Delete Job (always)
        if: always()
        run: |
          kubectl -n "$SCW_NAMESPACE" delete \
            "job/${{ steps.jobname.outputs.name }}" --ignore-not-found=true
