# Surch — K8s burst-bench CI/CD.
#
# Runs heavy CI gates (BEIR NDCG@10, INSEE paired bench) on the Scaleway
# Kapsule burst pool described in poc-k8s (rhanka/poc-k8s#2 + #6
# amendment). Every Job is short-lived; the burst pool autoscales 0 → 1
# → 0 on its own (declared `autoscaling=true` on the pool, no manual
# pool resize from this workflow). Hard 30 min cap is enforced inside
# each Job manifest via `activeDeadlineSeconds: 1800`.
#
# Cost guardrails (documentation-only at the workflow level, real
# enforcement inside the Job manifests):
#   SCW_MAX_COST_EUR=2  — DEV1-L node-hour ~0.08 €, 30 min ~0.04 €,
#                         leaves a 50× safety margin.
#   SCW_MAX_DURATION_MIN=30 — Jobs carry activeDeadlineSeconds=1800.

name: ci-k8s

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job manifest to run (ndcg-gate | insee-bench | 00-init-corpora)"
        required: true
        default: "ndcg-gate"
        type: choice
        options:
          - ndcg-gate
          - insee-bench
          - 00-init-corpora

env:
  SCW_MAX_COST_EUR: "2"
  SCW_MAX_DURATION_MIN: "30"
  SCW_NAMESPACE: surch
  GHCR_IMAGE: ghcr.io/rhanka/surch

jobs:
  bench-k8s:
    name: surch burst bench (${{ inputs.job }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image SHA
        id: image
        run: |
          IMAGE_SHA="${GITHUB_SHA}"
          echo "sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}:sha-${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "bench_image=${GHCR_IMAGE}:bench-sha-${IMAGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify GHCR image exists
        run: |
          set -eu
          IMAGE_REPO="${GHCR_IMAGE#ghcr.io/}"
          IMAGE_TAG="sha-${{ steps.image.outputs.sha }}"
          TOKEN="$(curl -fsSL "https://ghcr.io/token?scope=repository:${IMAGE_REPO}:pull" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not acquire a GHCR pull token for ${IMAGE_REPO}."
            exit 1
          fi
          check_image_tag() {
            tag="$1"
            label="$2"
            if ! curl -fsSI \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${IMAGE_REPO}/manifests/${tag}" >/dev/null; then
              echo "::error title=Missing GHCR ${label} image::Expected ${GHCR_IMAGE}:${tag}. Build it first with: gh workflow run docker-build.yml --ref ${GITHUB_REF_NAME}. Then rerun: gh workflow run ci-k8s.yml --ref ${GITHUB_REF_NAME} -f job=${{ inputs.job }}"
              exit 1
            fi
            echo "Verified ${label} image tag ${GHCR_IMAGE}:${tag}"
          }
          check_image_tag "$IMAGE_TAG" "runtime"
          case "${{ inputs.job }}" in
            ndcg-gate|insee-bench)
              check_image_tag "bench-${IMAGE_TAG}" "bench driver"
              ;;
          esac

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret in either raw YAML or base64-encoded form.
          if printf '%s' "$KUBE_CONFIG_DATA" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl get namespace "$SCW_NAMESPACE"

      - name: Render Job manifest with current SHA
        run: |
          mkdir -p target/k8s
          export SURCH_SHA="${{ steps.image.outputs.sha }}"
          envsubst '${SURCH_SHA}' < "deploy/k8s/jobs/${{ inputs.job }}.yaml" \
            > "target/k8s/${{ inputs.job }}.yaml"
          cat "target/k8s/${{ inputs.job }}.yaml"

      - name: Resolve Job name
        id: jobname
        run: |
          JOB_NAME=$(awk '
            /^kind:[[:space:]]*Job[[:space:]]*$/ { in_job=1; next }
            in_job && /^  name:/ { print $2; exit }
          ' "target/k8s/${{ inputs.job }}.yaml")
          if [ -z "$JOB_NAME" ]; then
            echo "::error::Could not resolve Job metadata.name from rendered manifest."
            exit 1
          fi
          echo "name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "Job name resolved: $JOB_NAME"

      - name: Validate PVC dependencies
        run: |
          set -eu
          missing=0
          pvcs="$(awk '/claimName:/ { print $2 }' "target/k8s/${{ inputs.job }}.yaml" | sort -u)"
          declared_pvcs="$(awk '
            /^kind:[[:space:]]*PersistentVolumeClaim[[:space:]]*$/ { in_pvc=1; next }
            in_pvc && /^  name:/ { print $2; in_pvc=0 }
          ' "target/k8s/${{ inputs.job }}.yaml" | sort -u)"
          if [ -z "$pvcs" ]; then
            echo "No PVC dependencies declared by ${{ inputs.job }}."
            exit 0
          fi
          for pvc in $pvcs; do
            if printf '%s\n' "$declared_pvcs" | grep -qx "$pvc"; then
              echo "PVC declared in manifest: $pvc"
              continue
            fi
            if kubectl -n "$SCW_NAMESPACE" get pvc "$pvc" >/dev/null 2>&1; then
              echo "PVC present: $pvc"
            else
              echo "::error::Missing required PVC in namespace $SCW_NAMESPACE: $pvc"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            kubectl -n "$SCW_NAMESPACE" get pvc || true
            exit 1
          fi

      - name: Apply Job manifest
        run: |
          kubectl -n "$SCW_NAMESPACE" apply -f "target/k8s/${{ inputs.job }}.yaml"

      - name: Wait for Job completion (30 min cap)
        run: |
          set -eu
          JOB_NAME="${{ steps.jobname.outputs.name }}"
          JOB_LABEL="app.kubernetes.io/component=${{ inputs.job }}"
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -le "$deadline" ]; do
            conditions="$(kubectl -n "$SCW_NAMESPACE" get "job/$JOB_NAME" \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' 2>/dev/null || true)"
            if printf '%s\n' "$conditions" | grep -qx 'Complete=True'; then
              echo "Kubernetes Job $JOB_NAME completed."
              exit 0
            fi
            if printf '%s\n' "$conditions" | grep -Eq '^(Failed|FailureTarget)=True$'; then
              echo "::error::Kubernetes Job $JOB_NAME entered a failure state."
              kubectl -n "$SCW_NAMESPACE" describe "job/$JOB_NAME" || true
              kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" -o wide || true
              kubectl -n "$SCW_NAMESPACE" describe pods -l "$JOB_LABEL" || true
              exit 1
            fi

            pod_states="$(kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"|phase="}{.status.phase}{"|"}{range .status.initContainerStatuses[*]}init:{.name}{":waiting="}{.state.waiting.reason}{";terminated="}{.state.terminated.reason}{";exit="}{.state.terminated.exitCode}{";last="}{.lastState.terminated.reason}{";last_exit="}{.lastState.terminated.exitCode}{","}{end}{range .status.containerStatuses[*]}{.name}{":waiting="}{.state.waiting.reason}{";terminated="}{.state.terminated.reason}{";exit="}{.state.terminated.exitCode}{";last="}{.lastState.terminated.reason}{";last_exit="}{.lastState.terminated.exitCode}{","}{end}{"\n"}{end}' 2>/dev/null || true)"
            if [ -n "$pod_states" ]; then
              printf '%s\n' "$pod_states"
            fi
            if printf '%s\n' "$pod_states" | grep -Eq '\|phase=Failed\|'; then
              echo "::error::Kubernetes pod for Job $JOB_NAME reached phase=Failed."
              kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" -o wide || true
              kubectl -n "$SCW_NAMESPACE" describe pods -l "$JOB_LABEL" || true
              exit 1
            fi
            if printf '%s\n' "$pod_states" | grep -Eq '(waiting=|terminated=|last=)(ErrImagePull|ImagePullBackOff|InvalidImageName|CreateContainerConfigError|CreateContainerError|RunContainerError|ContainerCannotRun|StartError|CrashLoopBackOff|Error|OOMKilled)'; then
              echo "::error::Kubernetes pod for Job $JOB_NAME hit a terminal container error."
              kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" -o wide || true
              kubectl -n "$SCW_NAMESPACE" describe pods -l "$JOB_LABEL" || true
              exit 1
            fi
            if printf '%s\n' "$pod_states" | grep -Eq '(^|[;,])exit=([1-9][0-9]*)([;,]|$)'; then
              echo "::error::Kubernetes pod for Job $JOB_NAME has a container with non-zero exit code."
              kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" -o wide || true
              kubectl -n "$SCW_NAMESPACE" describe pods -l "$JOB_LABEL" || true
              exit 1
            fi
            kubectl -n "$SCW_NAMESPACE" get "job/$JOB_NAME" -o wide || true
            sleep 10
          done
          echo "::error::Timed out waiting for Kubernetes Job $JOB_NAME to complete."
          exit 1

      - name: Collect logs + report
        if: always()
        run: |
          set +e
          mkdir -p target/bench-reports/k8s
          OUT_DIR="target/bench-reports/k8s"
          JOB_NAME="${{ steps.jobname.outputs.name }}"
          JOB_LABEL="app.kubernetes.io/component=${{ inputs.job }}"
          ARTIFACT_NAME="k8s-bench-${{ inputs.job }}-${{ steps.image.outputs.sha }}"

          kubectl -n "$SCW_NAMESPACE" describe "job/$JOB_NAME" \
            > "$OUT_DIR/${{ inputs.job }}.job.describe.txt" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" get "job/$JOB_NAME" -o yaml \
            > "$OUT_DIR/${{ inputs.job }}.job.yaml" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" -o wide \
            > "$OUT_DIR/${{ inputs.job }}.pods.txt" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" describe pods -l "$JOB_LABEL" \
            > "$OUT_DIR/${{ inputs.job }}.pods.describe.txt" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" get events --sort-by='.metadata.creationTimestamp' \
            > "$OUT_DIR/${{ inputs.job }}.events.txt" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" logs "job/$JOB_NAME" --all-containers=true --prefix=true \
            > "$OUT_DIR/${{ inputs.job }}.job.log" 2>&1 || true
          kubectl -n "$SCW_NAMESPACE" get "job/$JOB_NAME" \
            -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' \
            > "$OUT_DIR/${{ inputs.job }}.job.conditions.txt" 2>&1 || true

          REPORT_CONTAINER=""
          REPORT_FILES=""
          case "${{ inputs.job }}" in
            ndcg-gate)
              REPORT_CONTAINER="ndcg-driver"
              REPORT_FILES="summary.md bench.json scifact-surch.out scifact-os.out"
              ;;
            insee-bench)
              REPORT_CONTAINER="artillery-runner"
              REPORT_FILES="summary.md art-surch.json art-os.json"
              ;;
          esac

          PODS="$(kubectl -n "$SCW_NAMESPACE" get pods -l "$JOB_LABEL" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)"
          for POD in $PODS; do
            kubectl -n "$SCW_NAMESPACE" describe "pod/$POD" \
              > "$OUT_DIR/$POD.describe.txt" 2>&1 || true
            CONTAINERS="$(kubectl -n "$SCW_NAMESPACE" get "pod/$POD" \
              -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null || true)"
            for CONTAINER in $CONTAINERS; do
              kubectl -n "$SCW_NAMESPACE" logs "$POD" -c "$CONTAINER" \
                > "$OUT_DIR/$POD.$CONTAINER.log" 2>&1 || true
              kubectl -n "$SCW_NAMESPACE" logs "$POD" -c "$CONTAINER" --previous \
                > "$OUT_DIR/$POD.$CONTAINER.previous.log" 2>&1 || true
            done
            if [ -n "$REPORT_CONTAINER" ] && [ -n "$REPORT_FILES" ]; then
              for REPORT_FILE in $REPORT_FILES; do
                DEST_NAME="$(printf '%s' "$REPORT_FILE" | tr '/' '_')"
                kubectl -n "$SCW_NAMESPACE" cp -c "$REPORT_CONTAINER" \
                  "$POD:/reports/$REPORT_FILE" \
                  "$OUT_DIR/${{ inputs.job }}.$DEST_NAME" 2>/dev/null || true
              done
            fi
          done

          if [ -n "$JOB_NAME" ]; then
            kubectl -n "$SCW_NAMESPACE" get events \
              --field-selector "involvedObject.kind=Job,involvedObject.name=$JOB_NAME" \
              --sort-by='.metadata.creationTimestamp' \
              > "$OUT_DIR/${{ inputs.job }}.job.events.txt" 2>&1 || true
          fi

          {
            echo "artifact_name=$ARTIFACT_NAME"
            echo "out_dir=$OUT_DIR"
          } > "$OUT_DIR/${{ inputs.job }}.metadata.env"

      - name: Write run summary
        if: always()
        run: |
          set -eu
          OUT_DIR="target/bench-reports/k8s"
          SUMMARY_PATH="$OUT_DIR/${{ inputs.job }}.gha-summary.md"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACT_NAME="k8s-bench-${{ inputs.job }}-${{ steps.image.outputs.sha }}"
          JOB_NAME="${{ steps.jobname.outputs.name }}"
          CONDITIONS_FILE="$OUT_DIR/${{ inputs.job }}.job.conditions.txt"

          {
            echo "# ci-k8s summary"
            echo
            echo "- Run: $RUN_URL"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Input job: \`${{ inputs.job }}\`"
            echo "- Kubernetes Job: \`$JOB_NAME\`"
            echo "- Namespace: \`$SCW_NAMESPACE\`"
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Bench driver image: \`${{ steps.image.outputs.bench_image }}\`"
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo
            echo "## Job conditions"
            echo
            if [ -s "$CONDITIONS_FILE" ]; then
              echo '```text'
              cat "$CONDITIONS_FILE"
              echo '```'
            else
              echo "- no conditions captured"
            fi

            if [ -s "$OUT_DIR/${{ inputs.job }}.summary.md" ]; then
              echo
              echo "## Bench summary"
              echo
              cat "$OUT_DIR/${{ inputs.job }}.summary.md"
            elif [ -s "$OUT_DIR/${{ inputs.job }}.bench.json" ]; then
              echo
              echo "## Report index"
              echo
              echo '```json'
              cat "$OUT_DIR/${{ inputs.job }}.bench.json"
              echo
              echo '```'
            else
              echo
              echo "## Reports"
              echo
              echo "- no benchmark summary file copied from /reports"
            fi
          } > "$SUMMARY_PATH"

          cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-bench-${{ inputs.job }}-${{ steps.image.outputs.sha }}
          path: target/bench-reports/k8s/
          if-no-files-found: warn

      - name: Delete Job (always)
        if: always()
        run: |
          JOB_NAME="${{ steps.jobname.outputs.name }}"
          if [ -n "$JOB_NAME" ]; then
            kubectl -n "$SCW_NAMESPACE" delete \
              "job/$JOB_NAME" --ignore-not-found=true
          fi
