# Surch continuous integration.
#
# Runs on every push and pull-request: format, clippy, full test suite.
# Each commit on `main` must pass this workflow before iterative perf
# work moves to the next change.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --workspace --locked --tests
      - run: cargo test --workspace --locked

  p3-harness:
    name: harnais P3 synthétique
    runs-on: ubuntu-22.04
    steps:
      # Le vrai pilote archive trois commits P3 épinglés. Le checkout par
      # défaut est superficiel et ne contient que HEAD, donc il ne peut pas
      # vérifier ni construire les variantes A/B/C.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exécuter la matrice normale du gate P3
        run: bash deploy/bench-local/test-p3-harness.sh
      - name: Exécuter la matrice exhaustive du gate P3
        run: P3_MATRIX_EXHAUSTIVE=1 bash deploy/bench-local/test-p3-harness.sh
      - name: Exécuter le pilote P3 sans Docker ni VM
        run: bash deploy/bench-local/test-p3-campaign.sh

  # Manual scoring-side perf regression gate. Kept disabled (`if: false`)
  # because the criterion harness takes 5–10 minutes for the four groups
  # and `ubuntu-22.04` runners are too noisy for sub-millisecond
  # comparisons. Flip the guard once we have a dedicated bare-metal /
  # self-hosted runner with cpufreq pinned to `performance` and SMT off.
  # See `docs/ops/perf-bench.md` for the local workflow.
