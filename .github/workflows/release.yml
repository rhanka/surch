# Surch release pipeline.
#
# Triggers on `v*.*.*` tag pushes. Builds the linux x86_64 + aarch64 binaries,
# attaches them to a GitHub release with SHA-256 checksums, then builds and
# publishes a multi-arch Docker image to ghcr.io.
#
# The OCI image pushed to ghcr.io is signed via cosign keyless OIDC at the
# end of the publish-image job (signature anchored on the immutable digest
# returned by docker/build-push-action).
#
# Multi-platform binaries (macOS, musl) and minisign signatures of the
# static binaries come in a follow-up that wires cargo-dist.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write       # create release + upload assets
  packages: write       # push image to ghcr.io
  id-token: write       # OIDC token for cosign keyless signing

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  build-binaries:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64 only)
        if: matrix.cross == true
        run: cargo install --locked cross

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary (native)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} -p surch-api

      - name: Build release binary (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} -p surch-api

      - name: Stage and checksum the binary
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="surch-api-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/surch-api" "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          retention-days: 7

  publish-release:
    name: publish-github-release
    runs-on: ubuntu-22.04
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p dist
          # cargo-cyclonedx writes one bom.json per crate at the workspace
          # root; we merge by taking the workspace-level bom and renaming
          # it to surch-sbom-<tag>.cdx.json for the release asset.
          cargo cyclonedx --format json --all --target-in-filename
          # The workspace bom lives at ./bom.json; per-crate boms sit at
          # crates/<name>/bom.json. We ship the workspace one as the SBOM.
          if [ -f bom.json ]; then
            cp bom.json "dist/surch-sbom-${GITHUB_REF_NAME}.cdx.json"
          else
            # Fallback: prefer the surch-api crate bom, otherwise the first
            # bom.json we find under crates/.
            SBOM_SRC="$(find crates -maxdepth 3 -name 'bom.json' | head -n 1)"
            if [ -z "${SBOM_SRC}" ]; then
              echo "cargo-cyclonedx produced no bom.json" >&2
              exit 1
            fi
            cp "${SBOM_SRC}" "dist/surch-sbom-${GITHUB_REF_NAME}.cdx.json"
          fi
          ls -la "dist/surch-sbom-${GITHUB_REF_NAME}.cdx.json"

      - name: Upload SBOM artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: dist/surch-sbom-*.cdx.json
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/surch-api-*
            dist/surch-api-*.sha256
            dist/surch-sbom-*.cdx.json

  publish-image:
    name: publish-docker-image
    runs-on: ubuntu-22.04
    needs: [build-binaries, publish-release]
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx
          path: dist

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/surch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image by digest (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ghcr.io/${{ github.repository_owner }}/surch
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Signing the immutable digest covers every tag pushed by
          # docker/metadata-action: they all resolve to the same manifest.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest CycloneDX SBOM against image digest
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: ghcr.io/${{ github.repository_owner }}/surch
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          SBOM="dist/surch-sbom-${GITHUB_REF_NAME}.cdx.json"
          if [ ! -f "${SBOM}" ]; then
            echo "SBOM ${SBOM} missing — publish-release must have produced it" >&2
            exit 1
          fi
          cosign attest --yes \
            --predicate "${SBOM}" \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"
