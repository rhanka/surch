# Surch — paired bench Surch vs OpenSearch on INSEE Deces (~1.3M docs).
#
# One driver container plus two restartable init-container sidecars in
# the same Pod, all on localhost:
#   surch              ghcr.io/rhanka/surch:sha-${SURCH_SHA} (port 7700)
#   opensearch         opensearchproject/opensearch:2.17.1  (port 9200)
#   artillery-runner   ghcr.io/rhanka/surch:bench-sha-${SURCH_SHA}
#                      (runs artillery_bench)
#
# Output under `/reports/`:
#   * `art-surch.json` / `art-os.json` — `surch.bench.artillery.v1`
#   * `summary.md`                     — aggregated Markdown summary
# collected by the CI workflow via `kubectl cp`. The artillery harness
# drives both engines sequentially per the matchID `test-backend-v1.yml`
# scenario: 50 RPS sustained, 4 min.
#
# Resource envelope tuned to the tenant ResourceQuota
# (requests.cpu=500m, limits.cpu=2500m, requests.memory=512Mi,
# limits.memory=3Gi):
#   surch              cpu 150m req /  800m lim ; mem 128Mi req /  512Mi lim
#   opensearch         cpu 250m req / 1200m lim ; mem 256Mi req / 1536Mi lim
#   artillery-runner   cpu 100m req /  500m lim ; mem 128Mi req /  512Mi lim
#   ----------------------------------------------------------------------
#   total              cpu 500m req / 2500m lim ; mem 512Mi req / 2560Mi lim
# Mirrors the request envelope in poc-k8s/requests/surch.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: insee-bench
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: insee-bench
    app.kubernetes.io/part-of: surch-ci
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surch
        app.kubernetes.io/component: insee-bench
        app.kubernetes.io/part-of: surch-ci
    spec:
      restartPolicy: Never
      serviceAccountName: surch
      nodeSelector:
        k8s.scaleway.com/pool-name: burst
      tolerations:
        - key: pool
          operator: Equal
          value: burst
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      shareProcessNamespace: true
      volumes:
        - name: insee
          persistentVolumeClaim:
            claimName: surch-corpus-insee
            readOnly: true
        - name: scratch
          persistentVolumeClaim:
            claimName: surch-scratch
        - name: reports
          emptyDir: { sizeLimit: 128Mi }
      initContainers:
        # --- Engine #1: Surch -----------------------------------------
        - name: surch
          restartPolicy: Always
          image: ghcr.io/rhanka/surch:sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7700, name: surch-http }
          env:
            - { name: SURCH_HOST, value: "127.0.0.1" }
            - { name: SURCH_PORT, value: "7700" }
            - { name: RUST_LOG,   value: "warn" }
          resources:
            requests: { cpu: 150m, memory: 128Mi }
            limits:   { cpu: 800m, memory: 512Mi }
          volumeMounts:
            - { name: scratch, mountPath: /var/surch, subPath: surch-data }
        # --- Engine #2: OpenSearch ------------------------------------
        - name: opensearch
          restartPolicy: Always
          image: opensearchproject/opensearch:2.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 9200, name: os-http }
          env:
            - { name: discovery.type,              value: "single-node" }
            - { name: DISABLE_SECURITY_PLUGIN,     value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS,        value: "-Xms1g -Xmx1g" }
            - { name: bootstrap.memory_lock,       value: "false" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 1200m, memory: 1536Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - { name: scratch, mountPath: /usr/share/opensearch/data, subPath: opensearch-data }
      containers:
        # --- Driver: artillery_bench Rust harness ---------------------
        - name: artillery-runner
          image: ghcr.io/rhanka/surch:bench-sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          env:
            - { name: SURCH_URL,      value: "http://127.0.0.1:7700" }
            - { name: OPENSEARCH_URL, value: "http://127.0.0.1:9200" }
            - { name: INSEE_DIR,      value: "/data/insee" }
            - { name: REPORTS_DIR,    value: "/reports" }
            - { name: ART_PHASES,     value: "2:30,2:30,5:30,10:30,20:30,50:240" }
            - { name: ART_WORKERS,    value: "8" }
            - { name: RSS_SAMPLE_SECONDS, value: "420" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for both engines..."
              until wget -qO- "$SURCH_URL/" >/dev/null 2>&1; do sleep 0.5; done
              until wget -qO- "$OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=60s" >/dev/null 2>&1; do sleep 1; done
              mkdir -p "$REPORTS_DIR"
              RSS_SAMPLE_SECONDS="${RSS_SAMPLE_SECONDS:-420}"
              # shareProcessNamespace=true exposes sibling container PIDs in
              # /proc; the bench-driver image is procps-less so we scan
              # /proc/<pid>/cmdline directly (NUL-separated, hence `tr`).
              start_rss_sample() {
                label="$1"
                pattern="$2"
                output="$3"
                pid_file="$4"
                pid=""
                for d in /proc/[0-9]*; do
                  [ -r "$d/cmdline" ] || continue
                  if tr '\0' ' ' < "$d/cmdline" 2>/dev/null | grep -q "$pattern"; then
                    pid="${d#/proc/}"
                    break
                  fi
                done
                if [ -z "$pid" ]; then
                  echo "WARN: cannot start RSS sample for $label (pattern: $pattern)"
                  return 0
                fi
                /usr/local/bin/rss-sample.sh "$pid" "$RSS_SAMPLE_SECONDS" "$output" \
                  > "${output}.sampler.log" 2>&1 &
                echo $! > "$pid_file"
              }
              wait_rss_sample() {
                pid_file="$1"
                if [ ! -f "$pid_file" ]; then
                  return 0
                fi
                pid="$(cat "$pid_file" 2>/dev/null || true)"
                if [ -n "$pid" ]; then
                  wait "$pid" || true
                fi
              }
              # Bootstrap the `deces` index on both engines with the
              # INSEE 10k mapping + bulk-load slice baked into this
              # image. The slice NDJSON carries `_index: "deces"` in
              # every action header, so artillery_bench targets the
              # same index name below.
              start_rss_sample "surch" "surch-api" "$REPORTS_DIR/rss-art-surch.json" "$REPORTS_DIR/.rss-surch.pid"
              start_rss_sample "opensearch" "org.opensearch.bootstrap" "$REPORTS_DIR/rss-art-os.json" "$REPORTS_DIR/.rss-os.pid"
              bootstrap_engine() {
                url="$1"; label="$2"
                # The scratch PVC persists across ndcg-gate / insee-bench
                # runs, so OpenSearch / Surch boot with whatever indices
                # the previous job left behind (e.g. `scifact`,
                # `.opensearch-*` security indices). Drop the working
                # set before re-creating it, otherwise the bulk POST
                # below can 400 against a partially-allocated `deces`
                # index in a YELLOW cluster.
                curl -fsS -o /dev/null -X DELETE "$url/deces" 2>/dev/null || true
                # OpenSearch only — wait for cluster to become at least
                # YELLOW (single-node has no replicas) before we ask it
                # to ingest a brand new index.
                curl -fsS -o /dev/null \
                  "$url/_cluster/health?wait_for_status=yellow&timeout=30s" \
                  2>/dev/null || true
                echo "bootstrap $label: PUT /deces"
                curl -fsS -X PUT "$url/deces" \
                  -H 'Content-Type: application/json' \
                  --data-binary @/usr/local/share/deces/mapping.json \
                  > "$REPORTS_DIR/bootstrap-$label.put.json"
                # Wait for the freshly-PUT `deces` index to have its
                # primary shard active before we bulk-load against it.
                curl -fsS -o /dev/null \
                  "$url/_cluster/health/deces?wait_for_status=yellow&wait_for_active_shards=1&timeout=30s" \
                  2>/dev/null || true
                echo "bootstrap $label: POST /_bulk (10k docs)"
                gunzip -c /usr/local/share/deces/slice-10000.ndjson.gz \
                  | curl -fsS -X POST "$url/_bulk" \
                      -H 'Content-Type: application/x-ndjson' \
                      --data-binary @- \
                      > "$REPORTS_DIR/bootstrap-$label.bulk.json"
                # Refresh so newly indexed docs are searchable before
                # the load phase starts.
                curl -fsS -X POST "$url/deces/_refresh" \
                  > "$REPORTS_DIR/bootstrap-$label.refresh.json"
              }
              bootstrap_engine "$SURCH_URL" surch
              bootstrap_engine "$OPENSEARCH_URL" opensearch
              # Warm up both engines so JVM JIT + page caches are hot
              # before artillery_bench measures cold-start outliers
              # (OpenSearch phase-1 max would otherwise spike above
              # SLO_ARTILLERY_MAX_MS = 500 ms).
              warmup_engine() {
                url="$1"; label="$2"
                echo "warmup $label: 50 match_all hits"
                for i in $(seq 1 50); do
                  curl -fsS -o /dev/null -X POST "$url/deces/_search" \
                    -H 'Content-Type: application/json' \
                    -d '{"query":{"match_all":{}},"size":5}' \
                    || true
                done
              }
              warmup_engine "$SURCH_URL" surch
              warmup_engine "$OPENSEARCH_URL" opensearch
              # The bench driver image ships artillery_bench and
              # bench_report in /usr/local/bin.
              /usr/local/bin/artillery_bench \
                --url "$SURCH_URL" --index "deces" \
                --names "$INSEE_DIR/artillery_names.txt" \
                --workers "$ART_WORKERS" --phases "$ART_PHASES" \
                --report "$REPORTS_DIR/art-surch.json"
              /usr/local/bin/artillery_bench \
                --url "$OPENSEARCH_URL" --index "deces" \
                --names "$INSEE_DIR/artillery_names.txt" \
                --workers "$ART_WORKERS" --phases "$ART_PHASES" \
                --report "$REPORTS_DIR/art-os.json"
              /usr/local/bin/bench_report \
                --dir "$REPORTS_DIR" \
                --output "$REPORTS_DIR/summary.md"
              wait_rss_sample "$REPORTS_DIR/.rss-surch.pid"
              wait_rss_sample "$REPORTS_DIR/.rss-os.pid"
              echo "BEGIN_SURCH_K8S_SUMMARY"
              cat "$REPORTS_DIR/summary.md"
              echo "END_SURCH_K8S_SUMMARY"
              echo "insee-bench complete."
          volumeMounts:
            - { name: insee,   mountPath: /data/insee, readOnly: true }
            - { name: reports, mountPath: /reports }
