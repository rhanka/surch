# B1 Phase 3 — matchID ES-7.x oracle cross-check Job (per
# `docs/wp-d-matchid/B1-phase-3-plan.md`). Runs Surch + Elasticsearch
# 7.17.18 side by side in one Pod, bootstraps the `deces` index on
# both engines with the INSEE 10k slice, then drives the
# `tests/matchid_compat/replays/deces_v1.json` replay against both
# via the `b1_oracle` binary baked into the bench-driver image. The
# Job exits non-zero on the first behavioural divergence so the gate
# is also a structural-parity witness over time.
#
# Memory budget keeps the pod inside the current Scaleway tenant
# quota — `requests.memory` cap = 512 Mi, `limits.memory` cap = 3 GiB.
# Container requests stay deliberately low (kubelet only blocks pod
# admission on the requests sum) while limits remain sized for the
# real working set:
#   Surch (init)         req 64Mi  / limit 512Mi
#   Elasticsearch (init) req 256Mi / limit 1536Mi (-Xms1g -Xmx1g)
#   b1_oracle-driver     req 64Mi  / limit 384Mi
#   total requests       384Mi   (fits 512Mi cap)
#   total limits         ~2.4 GiB (fits 3 GiB cap)
# Anything above either cap needs a quota bump on poc-k8s.
apiVersion: batch/v1
kind: Job
metadata:
  name: b1-oracle-gate
  namespace: surch
  labels:
    app.kubernetes.io/component: b1-oracle-gate
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: b1-oracle-gate
    spec:
      restartPolicy: Never
      # fsGroup lets the Elasticsearch container (runAsUser 1000)
      # write its data directory inside the scratch PVC subPath.
      # Without it, the first ES boot dies with
      # `AccessDeniedException: /usr/share/elasticsearch/data/nodes`.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
        - key: pool
          operator: Equal
          value: burst
          effect: NoSchedule
      nodeSelector:
        k8s.scaleway.com/pool-name: burst
      volumes:
        - name: scratch
          persistentVolumeClaim:
            claimName: surch-scratch
        - name: reports
          emptyDir: { sizeLimit: 128Mi }
      initContainers:
        # --- Engine #1: Surch ---------------------------------
        - name: surch
          restartPolicy: Always
          image: ghcr.io/rhanka/surch:sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7700, name: surch-http }
          env:
            - { name: SURCH_HOST, value: "127.0.0.1" }
            - { name: SURCH_PORT, value: "7700" }
            - { name: RUST_LOG,   value: "warn" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 800m, memory: 512Mi }
          volumeMounts:
            - { name: scratch, mountPath: /var/surch, subPath: surch-b1-oracle }
        # --- Engine #2: Elasticsearch 7.17 oracle -------------
        - name: elasticsearch
          restartPolicy: Always
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 9200, name: es-http }
          env:
            - { name: discovery.type,              value: "single-node" }
            - { name: xpack.security.enabled,      value: "false" }
            - { name: ES_JAVA_OPTS,                value: "-Xms1g -Xmx1g" }
            - { name: bootstrap.memory_lock,       value: "false" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1200m, memory: 1536Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - { name: scratch, mountPath: /usr/share/elasticsearch/data, subPath: es-b1-oracle }
      containers:
        # --- Driver: b1_oracle Rust binary --------------------
        - name: b1-oracle-driver
          image: ghcr.io/rhanka/surch:bench-sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          env:
            - { name: SURCH_URL, value: "http://127.0.0.1:7700" }
            - { name: ES_URL,    value: "http://127.0.0.1:9200" }
            - { name: REPORTS_DIR, value: "/reports" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for both engines..."
              until wget -qO- "$SURCH_URL/" >/dev/null 2>&1; do sleep 0.5; done
              until wget -qO- "$ES_URL/_cluster/health?wait_for_status=yellow&timeout=60s" >/dev/null 2>&1; do sleep 1; done
              mkdir -p "$REPORTS_DIR"
              # The bench-driver image ships the INSEE 10k slice
              # under /usr/local/share/deces/ and the mapping.json
              # alongside it. b1_oracle picks them up via flags.
              /usr/local/bin/b1_oracle \
                --url-surch "$SURCH_URL" \
                --url-es "$ES_URL" \
                --mapping /usr/local/share/deces/mapping.json \
                --slice /usr/local/share/deces/slice-10000.ndjson.gz \
                --replay /usr/local/share/deces/replays/deces_v1.json \
                --out "$REPORTS_DIR/b1-oracle.json"
              echo "BEGIN_SURCH_K8S_B1_ORACLE"
              cat "$REPORTS_DIR/b1-oracle.json"
              echo "END_SURCH_K8S_B1_ORACLE"
              echo "b1-oracle-gate complete."
          volumeMounts:
            - { name: reports, mountPath: /reports }
