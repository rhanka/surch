# Surch — corpus pre-warm Job (run once on tenant landing).
#
# Pre-loads three PVCs the recurring CI Jobs mount read-only:
#   surch-corpus-beir   — BEIR SciFact (~50 MiB) + TREC-COVID (~1 GiB)
#   surch-corpus-insee  — INSEE Deces 2024+2025 (~500 MiB ndjson)
#   surch-scratch       — empty scratch (5 GiB) for engine index dirs
#
# Lightweight: pure curlimages/curl image (~5 MB, public Docker Hub).
# No Surch logic here; we just hydrate volumes and exit. Subsequent Jobs
# mount these PVCs read-only and never re-download.
#
# Cost: ~5 min single DEV1-L burst node = ~0.007€.
apiVersion: batch/v1
kind: Job
metadata:
  name: init-corpora
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: 00-init-corpora
    app.kubernetes.io/part-of: surch-ci
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # keep 1d for log inspection, then GC
  activeDeadlineSeconds: 1800     # SCW_MAX_DURATION_MIN=30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surch
        app.kubernetes.io/component: 00-init-corpora
        app.kubernetes.io/part-of: surch-ci
    spec:
      restartPolicy: OnFailure
      serviceAccountName: surch
      imagePullSecrets:
        - name: ghcr-pull
      # Schedule on the dedicated burst pool. The pool taint is applied
      # by `make pool-burst` in poc-k8s; tolerate it explicitly.
      nodeSelector:
        pool: burst
      tolerations:
        - key: pool
          operator: Equal
          value: burst
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: beir
          persistentVolumeClaim:
            claimName: surch-corpus-beir
        - name: insee
          persistentVolumeClaim:
            claimName: surch-corpus-insee
        - name: scratch
          persistentVolumeClaim:
            claimName: surch-scratch
      containers:
        - name: fetch
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          # Resource envelope: well under the tenant quota (req 200m/256Mi,
          # limit 1000m/512Mi as per requests/surch.md § Workloads).
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: BEIR_DIR
              value: /data/beir
            - name: INSEE_DIR
              value: /data/insee
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "== BEIR SciFact (binary qrels, ~50 MiB) =="
              mkdir -p "$BEIR_DIR/scifact"
              # Public mirror — Anserini-friendly tarball; canonical BEIR cellar.
              curl -fsSL --retry 3 \
                "https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip" \
                -o "$BEIR_DIR/scifact.zip"
              cd "$BEIR_DIR" && unzip -qo scifact.zip && rm scifact.zip

              echo "== BEIR TREC-COVID (graded qrels, ~1 GiB) =="
              mkdir -p "$BEIR_DIR/trec-covid"
              curl -fsSL --retry 3 \
                "https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/trec-covid.zip" \
                -o "$BEIR_DIR/trec-covid.zip"
              cd "$BEIR_DIR" && unzip -qo trec-covid.zip && rm trec-covid.zip

              echo "== INSEE Deces 2024+2025 (~500 MiB ndjson) =="
              mkdir -p "$INSEE_DIR"
              # INSEE Open Data CDN — annual aggregated files. URLs may
              # change yearly; cluster owner pins the latest stable.
              for year in 2024 2025; do
                curl -fsSL --retry 3 \
                  "https://www.insee.fr/fr/statistiques/fichier/4769950/deces-${year}.txt" \
                  -o "$INSEE_DIR/deces-${year}.txt" || \
                  echo "WARN: INSEE ${year} not yet published; continuing"
              done

              echo "== Done; PVCs hydrated =="
              du -sh "$BEIR_DIR" "$INSEE_DIR"
          volumeMounts:
            - { name: beir,    mountPath: /data/beir }
            - { name: insee,   mountPath: /data/insee }
            - { name: scratch, mountPath: /data/scratch }
