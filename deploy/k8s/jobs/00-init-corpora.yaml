# Surch — corpus pre-warm Job (run once on tenant landing).
#
# Pre-loads three PVCs the recurring CI Jobs mount read-only:
#   surch-corpus-beir   — BEIR SciFact (~50 MiB) + TREC-COVID (~1 GiB)
#   surch-corpus-insee  — matchID deces artillery fixtures (~5 MiB)
#   surch-scratch       — empty scratch (5 GiB) for engine index dirs
#
# Uses a Python image so downloads and zip extraction do not depend on
# optional shell utilities in the container image. No Surch logic here; we
# just hydrate volumes and exit. Subsequent Jobs mount these PVCs read-only
# and never re-download. The deces corpus uses matchID's stable examples
# fixtures instead of live INSEE public endpoints, so the CI smoke is
# deterministic and matches the deces-backend artillery payload.
#
# Cost: ~5 min single DEV1-L burst node = ~0.007€.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surch-corpus-beir
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: 00-init-corpora
    app.kubernetes.io/part-of: surch-ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surch-corpus-insee
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: 00-init-corpora
    app.kubernetes.io/part-of: surch-ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surch-scratch
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: 00-init-corpora
    app.kubernetes.io/part-of: surch-ci
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-corpora
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: 00-init-corpora
    app.kubernetes.io/part-of: surch-ci
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # keep 1d for log inspection, then GC
  activeDeadlineSeconds: 1800     # SCW_MAX_DURATION_MIN=30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surch
        app.kubernetes.io/component: 00-init-corpora
        app.kubernetes.io/part-of: surch-ci
    spec:
      restartPolicy: OnFailure
      serviceAccountName: surch
      # Schedule on the dedicated Scaleway burst pool. Keep the toleration
      # for clusters that also taint burst nodes with pool=burst.
      nodeSelector:
        k8s.scaleway.com/pool-name: burst
      tolerations:
        - key: pool
          operator: Equal
          value: burst
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: beir
          persistentVolumeClaim:
            claimName: surch-corpus-beir
        - name: insee
          persistentVolumeClaim:
            claimName: surch-corpus-insee
        - name: scratch
          persistentVolumeClaim:
            claimName: surch-scratch
      containers:
        - name: fetch
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          # Resource envelope: well under the tenant quota (req 200m/256Mi,
          # limit 1000m/512Mi as per requests/surch.md § Workloads).
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: BEIR_DIR
              value: /data/beir
            - name: INSEE_DIR
              value: /data/insee
          command: ["python3", "-c"]
          args:
            - |
              import csv
              import os
              import shutil
              import sys
              import time
              import urllib.request
              import zipfile
              from pathlib import Path

              beir_dir = Path(os.environ["BEIR_DIR"])
              insee_dir = Path(os.environ["INSEE_DIR"])

              def fetch(url, dest, required=True):
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  last_error = None
                  for attempt in range(1, 4):
                      try:
                          print(f"fetch {url} -> {dest} (attempt {attempt}/3)", flush=True)
                          with urllib.request.urlopen(url, timeout=300) as response:
                              with dest.open("wb") as output:
                                  shutil.copyfileobj(response, output)
                          return True
                      except Exception as exc:
                          last_error = exc
                          print(f"WARN: fetch failed: {exc}", file=sys.stderr, flush=True)
                          time.sleep(2 * attempt)
                  if required:
                      raise RuntimeError(f"failed to fetch required URL {url}: {last_error}")
                  return False

              def extract_zip(archive, dest):
                  root = dest.resolve()
                  with zipfile.ZipFile(archive) as zf:
                      for info in zf.infolist():
                          target = (dest / info.filename).resolve()
                          if target != root and root not in target.parents:
                              raise RuntimeError(f"unsafe zip member path: {info.filename}")
                      zf.extractall(dest)
                  archive.unlink()

              def tree_mib(path):
                  total = 0
                  for child in path.rglob("*"):
                      if child.is_file():
                          total += child.stat().st_size
                  return total / (1024 * 1024)

              print("== BEIR SciFact (binary qrels, ~50 MiB) ==", flush=True)
              scifact_zip = beir_dir / "scifact.zip"
              fetch(
                  "https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip",
                  scifact_zip,
              )
              extract_zip(scifact_zip, beir_dir)

              print("== BEIR TREC-COVID (graded qrels, ~1 GiB) ==", flush=True)
              trec_covid_zip = beir_dir / "trec-covid.zip"
              fetch(
                  "https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/trec-covid.zip",
                  trec_covid_zip,
              )
              extract_zip(trec_covid_zip, beir_dir)

              print("== matchID deces fixtures ==", flush=True)
              insee_dir.mkdir(parents=True, exist_ok=True)
              matchid_base = "https://github.com/matchID-project/examples/raw/master/data"
              clients_csv = insee_dir / "clients_test.csv"
              deaths_csv = insee_dir / "deaths_test.csv"
              fetch(f"{matchid_base}/clients_test.csv", clients_csv)
              fetch(f"{matchid_base}/deaths_test.csv", deaths_csv)

              def require_columns(path, columns):
                  with path.open(newline="", encoding="utf-8") as source:
                      reader = csv.DictReader(source, delimiter=";")
                      missing = [column for column in columns if column not in (reader.fieldnames or [])]
                      if missing:
                          raise RuntimeError(f"{path} missing expected columns: {missing}")

              require_columns(clients_csv, ["Nom", "Date", "Prenom"])
              require_columns(deaths_csv, ["DCD_DATE_NAISSANCE", "DCD_NOM", "DCD_PRENOMS"])

              names_tsv = insee_dir / "artillery_names.txt"
              usable = 0
              with clients_csv.open(newline="", encoding="utf-8") as source, names_tsv.open("w", encoding="utf-8") as output:
                  reader = csv.DictReader(source, delimiter=";")
                  for row in reader:
                      prenom = (row.get("Prenom") or "").strip()
                      nom = (row.get("Nom") or "").strip()
                      date = (row.get("Date") or "").strip()
                      if not prenom or not nom:
                          continue
                      output.write(f"{prenom}\t{nom}\t{date}\n")
                      usable += 1
              if usable == 0:
                  raise RuntimeError(f"{clients_csv} produced zero usable artillery rows")
              print(f"generated {names_tsv} from {usable} matchID artillery rows", flush=True)

              print("== Done; PVCs hydrated ==", flush=True)
              print(f"{beir_dir}: {tree_mib(beir_dir):.1f} MiB", flush=True)
              print(f"{insee_dir}: {tree_mib(insee_dir):.1f} MiB", flush=True)
          volumeMounts:
            - { name: beir,    mountPath: /data/beir }
            - { name: insee,   mountPath: /data/insee }
            - { name: scratch, mountPath: /data/scratch }
