# Surch — BEIR NDCG@10 parity gate (SciFact + TREC-COVID).
#
# Spins up a single Pod with two restartable init-container sidecars
# (surch + opensearch) and a driver container that runs both
# `scripts/bench/scifact-ndcg.sh` and `scripts/bench/trec-covid-ndcg.sh`
# against both engines, then emits a human summary, text outputs, and a
# JSON index to /reports.
#
# The Pod-anti-affinity story stays simple here: both engines are local
# to the Pod, talking over localhost. Resource envelope (post TREC-COVID
# bumps — corpus is 171 k docs; earlier 512Mi/2Gi/3Gi Surch limits all
# OOM'd before the corpus finished. Run 26285164167 OOM'd at chunk 14
# under Surch=3Gi (peak 2964 MiB, run-to-run variance +319 MiB).
# poc-k8s tenant quota was raised to limits.memory=7Gi to give the
# ndcg-gate Job real headroom; Surch now gets 4Gi which leaves margin
# above the 2964 MiB observed peak, and the OS+driver stay at 3Gi
# combined to fit the 7 GiB tenant cap. The 800m-only effective Surch
# CPU is a separate single-thread bulk-path bottleneck that needs a
# code-level fix on the Track A side, not more cores):
#   surch       cpu  150m req / 2000m lim ; mem 256Mi req / 4096Mi lim
#   opensearch  cpu  250m req / 1200m lim ; mem 256Mi req / 2048Mi lim  (JVM Xmx=1g)
#   driver      cpu  100m req /  500m lim ; mem 128Mi req / 1024Mi lim
#   ---------------------------------------------------------------
#   total       cpu  500m req / 3700m lim ; mem 640Mi req / 7168Mi lim
# Requires the tenant ResourceQuota in poc-k8s to allow limits.memory>=6Gi
# (the previous 3Gi cap covered SciFact only). Runs on the DEV1-XL (4 vCPU /
# 8 GiB) burst node — DEV1-L is no longer enough.
#
# `${SURCH_SHA}` is substituted by the GHA workflow via envsubst and
# rendered into the docker-build.yml tag format: `sha-<full commit SHA>`.
apiVersion: batch/v1
kind: Job
metadata:
  name: ndcg-gate
  namespace: surch
  labels:
    app.kubernetes.io/name: surch
    app.kubernetes.io/component: ndcg-gate
    app.kubernetes.io/part-of: surch-ci
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surch
        app.kubernetes.io/component: ndcg-gate
        app.kubernetes.io/part-of: surch-ci
    spec:
      restartPolicy: Never
      serviceAccountName: surch
      nodeSelector:
        k8s.scaleway.com/pool-name: burst
      tolerations:
        - key: pool
          operator: Equal
          value: burst
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: beir
          persistentVolumeClaim:
            claimName: surch-corpus-beir
            readOnly: true
        - name: scratch
          persistentVolumeClaim:
            claimName: surch-scratch
        - name: reports
          emptyDir: { sizeLimit: 64Mi }
      initContainers:
        # --- Engine sidecar #1: Surch ---------------------------------
        - name: surch
          restartPolicy: Always
          image: ghcr.io/rhanka/surch:sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7700, name: surch-http }
          env:
            - { name: SURCH_HOST, value: "127.0.0.1" }
            - { name: SURCH_PORT, value: "7700" }
            - { name: RUST_LOG,   value: "warn" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits:   { cpu: 2000m, memory: 4Gi }
          volumeMounts:
            - { name: scratch, mountPath: /var/surch }
        # --- Engine sidecar #2: OpenSearch baseline -------------------
        - name: opensearch
          restartPolicy: Always
          image: opensearchproject/opensearch:2.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 9200, name: os-http }
          env:
            - { name: discovery.type,                     value: "single-node" }
            - { name: DISABLE_SECURITY_PLUGIN,            value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG,        value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS,               value: "-Xms1g -Xmx1g" }
            - { name: bootstrap.memory_lock,              value: "false" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 1200m, memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          # OpenSearch 2.x requires a writable scratch dir for its data path.
          volumeMounts:
            - { name: scratch, mountPath: /usr/share/opensearch/data, subPath: opensearch-data }
      containers:
        # --- Driver: scifact-ndcg.sh against both engines -------------
        - name: ndcg-driver
          image: ghcr.io/rhanka/surch:bench-sha-${SURCH_SHA}
          imagePullPolicy: IfNotPresent
          env:
            - { name: SURCH_URL,      value: "http://127.0.0.1:7700" }
            - { name: OPENSEARCH_URL, value: "http://127.0.0.1:9200" }
            - { name: BEIR_DIR,       value: "/data/beir" }
            - { name: REPORTS_DIR,    value: "/reports" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          command: ["/bin/sh", "-c"]
          # The bench driver image bundles scripts/bench/{scifact,trec-covid}-ndcg.sh;
          # this driver waits for both engines, runs both BEIR gates against
          # Surch and OpenSearch, and exits with the last script's status.
          # CI reads /reports/summary.md and /reports/bench.json; the
          # `*-ndcg.out` files are aggregated by `bench_report --dir`.
          args:
            - |
              set -eu
              echo "Waiting for Surch + OpenSearch..."
              until wget -qO- "$SURCH_URL/" >/dev/null 2>&1; do sleep 0.5; done
              until wget -qO- "$OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=30s" >/dev/null 2>&1; do sleep 1; done
              echo "Both engines healthy."
              mkdir -p "$REPORTS_DIR"
              /usr/local/bin/scifact-ndcg.sh   "ndcg-surch-k8s" "$REPORTS_DIR/scifact-surch.out"    "$SURCH_URL"
              /usr/local/bin/scifact-ndcg.sh   "ndcg-os-k8s"    "$REPORTS_DIR/scifact-os.out"       "$OPENSEARCH_URL"
              /usr/local/bin/trec-covid-ndcg.sh "ndcg-surch-k8s" "$REPORTS_DIR/trec-covid-surch.out" "$SURCH_URL"
              /usr/local/bin/trec-covid-ndcg.sh "ndcg-os-k8s"    "$REPORTS_DIR/trec-covid-os.out"    "$OPENSEARCH_URL"
              {
                echo "# BEIR NDCG gate"
                echo
                echo "## SciFact / Surch"
                cat "$REPORTS_DIR/scifact-surch.out"
                echo
                echo "## SciFact / OpenSearch"
                cat "$REPORTS_DIR/scifact-os.out"
                echo
                echo "## TREC-COVID / Surch"
                cat "$REPORTS_DIR/trec-covid-surch.out"
                echo
                echo "## TREC-COVID / OpenSearch"
                cat "$REPORTS_DIR/trec-covid-os.out"
              } > "$REPORTS_DIR/summary.md"
              cat > "$REPORTS_DIR/bench.json" <<EOF
              {"schema":"surch.bench.ndcg_gate.v1","scifact_surch_out":"$REPORTS_DIR/scifact-surch.out","scifact_opensearch_out":"$REPORTS_DIR/scifact-os.out","trec_covid_surch_out":"$REPORTS_DIR/trec-covid-surch.out","trec_covid_opensearch_out":"$REPORTS_DIR/trec-covid-os.out"}
              EOF
              echo "BEGIN_SURCH_K8S_SUMMARY"
              cat "$REPORTS_DIR/summary.md"
              echo "END_SURCH_K8S_SUMMARY"
              echo "BEGIN_SURCH_K8S_BENCH_JSON"
              cat "$REPORTS_DIR/bench.json"
              echo "END_SURCH_K8S_BENCH_JSON"
              echo "ndcg-gate complete."
          volumeMounts:
            - { name: beir,    mountPath: /data/beir, readOnly: true }
            - { name: reports, mountPath: /reports }
