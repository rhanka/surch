[workspace]
members = [
    "crates/surch-types",
    "crates/surch-analysis",
    "crates/surch-codec",
    "crates/surch-store",
    "crates/surch-index",
    "crates/surch-search",
    "crates/surch-api",
    "crates/opensearch-oracle",
    "crates/portage-ledger",
    "crates/surch-demo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Surch Team"]
homepage = "https://github.com/rhanka/surch"
repository = "https://github.com/rhanka/surch"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
unicode-segmentation = "1.10"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
fst = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
