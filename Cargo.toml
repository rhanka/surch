[workspace]
members = [
    "crates/surch-types",
    "crates/surch-analysis",
    "crates/surch-codec",
    "crates/surch-store",
    "crates/surch-index",
    "crates/surch-search",
    "crates/surch-api",
    "crates/opensearch-oracle",
    "crates/portage-ledger",
    "crates/surch-demo",
    "crates/matchid-replay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Surch Team"]
homepage = "https://github.com/rhanka/surch"
repository = "https://github.com/rhanka/surch"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.32", default-features = false, features = ["tracing-log"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rayon = "1.10"
unicode-segmentation = "1.10"
unicode-normalization = "0.1"
parking_lot = "0.12"
once_cell = "1.19"
bytes = "1.5"
blake3 = "1.8.5"
constant_time_eq = "0.4.2"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
fst = "0.4"
tar = "0.4"
flate2 = "1.0"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
http = "1"
# C-SNAPSHOT-S2: S3Repository backend. `aws-sdk-s3` is the official
# AWS SDK for Rust; we pin the minor and disable default features so
# the build picks up only the runtime/region/credentials machinery we
# actually need (no STS / SSO / IMDS by default — static creds + a
# region + an optional endpoint URL cover S3 / R2 / MinIO / GCS).
# `default-https-client` re-adds the smithy hyper+rustls connector
# explicitly; without it every PutObject / GetObject fails with
# `ConnectorError: No HTTP client was available to send this request`,
# which masquerades as a generic "unhandled error" in the snapshot
# I/O layer.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-credential-types = { version = "1", default-features = false }
aws-smithy-runtime-api = { version = "1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# cargo-dist drives the release pipeline (multi-target build + archive +
# checksums). Targets cover linux gnu/musl on x86_64 and aarch64, plus the
# two Apple Darwin triples. Installers are deferred; we ship raw archives
# and let downstream consumers verify via sha256 + minisign.
#
# `pr-run-mode = "skip"` keeps cargo-dist's own CI off PRs — the release
# workflow runs only on tag pushes, matching the existing trigger.
# `publish-jobs` points at the in-repo publish-image job so cargo-dist
# does not try to publish anything itself; the OCI image + cosign + SBOM
# attestation path remains under our control.
[workspace.metadata.dist]
cargo-dist-version = "0.25.1"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ci = ["github"]
installers = ["shell", "powershell"]
pr-run-mode = "skip"
publish-jobs = ["./publish-image"]
