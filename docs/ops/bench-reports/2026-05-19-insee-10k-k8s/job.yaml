          readOnly: true
        - mountPath: /reports
          name: reports
      dnsPolicy: ClusterFirst
      initContainers:
      - env:
        - name: SURCH_HOST
          value: 127.0.0.1
        - name: SURCH_PORT
          value: "7700"
        - name: RUST_LOG
          value: warn
        image: ghcr.io/rhanka/surch:sha-495403ca41784dbe1f7ab58c3967e7e8247596fa
        imagePullPolicy: IfNotPresent
