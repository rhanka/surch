ers \"$ART_WORKERS\" --phases \"$ART_PHASES\" \\\n  --report \"$REPORTS_DIR/art-os.json\"\n# RSS budget is per-workload: on the full 171k corpus Surch's\n# resident set scales to ~2.1 GiB (documented, not a\n# regression), well above the INSEE 10k default of 1024 MB.\n# Declare a corpus-appropriate budget so the latency Job is\n# gated on Surch latency + error rate, not on a memory\n# threshold calibrated for a 17x smaller corpus.\n/usr/local/bin/bench_report \\\n  --dir \"$REPORTS_DIR\" \\\n  --output \"$REPORTS_DIR/summary.md\" \\\n  --rss-peak-mb 2560\nwait_rss_sample \"$REPORTS_DIR/.rss-surch.pid\"\nwait_rss_sample \"$REPORTS_DIR/.rss-os.pid\"\n# Surface each rss-*.json envelope between markers so the\n# ci-k8s workflow can reconstruct them when the emptyDir\n# /reports volume is gone after driver termination.\nfor f in \"$REPORTS_DIR\"/rss-art-*.json; do\n  [ -f \"$f\" ] || continue\n  fname=\"$(basename \"$f\")\"\n  echo \"BEGIN_SURCH_K8S_RSS_FILE:$fname\"\n  cat \"$f\"\n  echo\n  echo \"END_SURCH_K8S_RSS_FILE:$fname\"\ndone\necho \"BEGIN_SURCH_K8S_SUMMARY\"\ncat \"$REPORTS_DIR/summary.md\"\necho \"END_SURCH_K8S_SUMMARY\"\necho \"trec-covid-latency complete.\"\n"],"command":["/bin/sh","-c"],"env":[{"name":"SURCH_URL","value":"http://127.0.0.1:7700"},{"name":"OPENSEARCH_URL","value":"http://127.0.0.1:9200"},{"name":"BEIR_DIR","value":"/data/beir"},{"name":"REPORTS_DIR","value":"/reports"},{"name":"TREC_INDEX","value":"trec-covid"},{"name":"TREC_BULK_CHUNK_SIZE","value":"8m"},{"name":"ART_PHASES","value":"2:30,2:30,5:30,10:30,20:30,50:240"},{"name":"ART_WORKERS","value":"8"},{"name":"RSS_SAMPLE_SECONDS","value":"600"}],"image":"ghcr.io/rhanka/surch:bench-sha-9f53ba2309d3ac8df436f083b40cfb9373426d7b","imagePullPolicy":"IfNotPresent","name":"artillery-runner","resources":{"limits":{"cpu":"500m","memory":"1Gi"},"requests":{"cpu":"100m","memory":"128Mi"}},"volumeMounts":[{"mountPath":"/data/beir","name":"beir","readOnly":true},{"mountPath":"/reports","name":"reports"}]}],"initContainers":[{"env":[{"name":"SURCH_HOST","value":"127.0.0.1"},{"name":"SURCH_PORT","value":"7700"},{"name":"RUST_LOG","value":"warn"}],"image":"ghcr.io/rhanka/surch:sha-9f53ba2309d3ac8df436f083b40cfb9373426d7b","imagePullPolicy":"IfNotPresent","name":"surch","ports":[{"containerPort":7700,"name":"surch-http"}],"resources":{"limits":{"cpu":"2000m","memory":"7Gi"},"requests":{"cpu":"150m","memory":"256Mi"}},"restartPolicy":"Always","volumeMounts":[{"mountPath":"/var/surch","name":"scratch","subPath":"surch-data"}]},{"env":[{"name":"discovery.type","value":"single-node"},{"name":"DISABLE_SECURITY_PLUGIN","value":"true"},{"name":"DISABLE_INSTALL_DEMO_CONFIG","value":"true"},{"name":"OPENSEARCH_JAVA_OPTS","value":"-Xms1g -Xmx1g"},{"name":"bootstrap.memory_lock","value":"false"}],"image":"opensearchproject/opensearch:2.17.1","imagePullPolicy":"IfNotPresent","name":"opensearch","ports":[{"containerPort":9200,"name":"os-http"}],"resources":{"limits":{"cpu":"1200m","memory":"2Gi"},"requests":{"cpu":"250m","memory":"256Mi"}},"restartPolicy":"Always","securityContext":{"runAsGroup":1000,"runAsNonRoot":true,"runAsUser":1000},"volumeMounts":[{"mountPath":"/usr/share/opensearch/data","name":"scratch","subPath":"opensearch-data"}]}],"nodeSelector":{"k8s.scaleway.com/pool-name":"burst"},"restartPolicy":"Never","securityContext":{"fsGroup":65532,"runAsGroup":65532,"runAsNonRoot":true,"runAsUser":65532},"serviceAccountName":"surch","shareProcessNamespace":true,"tolerations":[{"effect":"NoSchedule","key":"pool","operator":"Equal","value":"burst"}],"volumes":[{"name":"beir","persistentVolumeClaim":{"claimName":"surch-corpus-beir","readOnly":true}},{"name":"scratch","persistentVolumeClaim":{"claimName":"surch-scratch"}},{"emptyDir":{"sizeLimit":"128Mi"},"name":"reports"}]}},"ttlSecondsAfterFinished":3600}}
