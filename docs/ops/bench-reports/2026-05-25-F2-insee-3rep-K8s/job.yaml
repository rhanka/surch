  backoffLimit: 0
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels:
      batch.kubernetes.io/controller-uid: 58c198d1-d16c-46d9-ae87-037c30d732c8
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/component: insee-bench
        app.kubernetes.io/name: surch
        app.kubernetes.io/part-of: surch-ci
        batch.kubernetes.io/controller-uid: 58c198d1-d16c-46d9-ae87-037c30d732c8
        batch.kubernetes.io/job-name: insee-bench
        controller-uid: 58c198d1-d16c-46d9-ae87-037c30d732c8
        job-name: insee-bench
    spec:
      containers:
      - args:
        - |
          set -eu
          echo "Waiting for both engines..."
          until wget -qO- "$SURCH_URL/" >/dev/null 2>&1; do sleep 0.5; done
          until wget -qO- "$OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=60s" >/dev/null 2>&1; do sleep 1; done
          mkdir -p "$REPORTS_DIR"
          RSS_SAMPLE_SECONDS="${RSS_SAMPLE_SECONDS:-420}"
          # shareProcessNamespace=true exposes sibling container PIDs
          # in /proc; the bench-driver image is procps-less so we scan
          # /proc/<pid>/cmdline directly. We match the basename of
          # argv[0] (not the whole cmdline) to avoid false positives on
          # the driver `sh -c "<script>"` whose cmdline embeds the
          # script body. An optional content substring is required when
          # the engine binary is generic (e.g. `java` for OpenSearch).
          start_rss_sample() {
            label="$1"
            binary="$2"
            content="$3"
            output="$4"
            pid_file="$5"
            pid=""
            for d in /proc/[0-9]*; do
              [ -r "$d/cmdline" ] || continue
              argv0="$(tr '\0' '\n' < "$d/cmdline" 2>/dev/null | head -n 1)"
              [ -n "$argv0" ] || continue
              case "${argv0##*/}" in
                "$binary") ;;
                *) continue ;;
              esac
              if [ -n "$content" ]; then
                tr '\0' ' ' < "$d/cmdline" 2>/dev/null | grep -q "$content" || continue
              fi
              pid="${d#/proc/}"
              break
            done
            if [ -z "$pid" ]; then
              echo "WARN: cannot start RSS sample for $label (binary: $binary, content: $content)"
              return 0
            fi
            /usr/local/bin/rss-sample.sh "$pid" "$RSS_SAMPLE_SECONDS" "$output" \
              > "${output}.sampler.log" 2>&1 &
            echo $! > "$pid_file"
          }
          wait_rss_sample() {
            pid_file="$1"
            if [ ! -f "$pid_file" ]; then
              return 0
            fi
            pid="$(cat "$pid_file" 2>/dev/null || true)"
            if [ -n "$pid" ]; then
              wait "$pid" || true
            fi
          }
          # Bootstrap the `deces` index on both engines with the
          # INSEE 10k mapping + bulk-load slice baked into this
          # image. The slice NDJSON carries `_index: "deces"` in
          # every action header, so artillery_bench targets the
          # same index name below.
          start_rss_sample "surch"      "surch-api" ""                         "$REPORTS_DIR/rss-art-surch.json" "$REPORTS_DIR/.rss-surch.pid"
          start_rss_sample "opensearch" "java"      "org.opensearch.bootstrap" "$REPORTS_DIR/rss-art-os.json"    "$REPORTS_DIR/.rss-os.pid"
          bootstrap_engine() {
            url="$1"; label="$2"
            # The scratch PVC persists across ndcg-gate / insee-bench
            # runs, so OpenSearch / Surch boot with whatever indices
            # the previous job left behind (e.g. `scifact`,
            # `.opensearch-*` security indices). Drop the working
            # set before re-creating it, otherwise the bulk POST
            # below can 400 against a partially-allocated `deces`
            # index in a YELLOW cluster.
            curl -fsS -o /dev/null -X DELETE "$url/deces" 2>/dev/null || true
            # OpenSearch only — wait for cluster to become at least
            # YELLOW (single-node has no replicas) before we ask it
            # to ingest a brand new index.
            curl -fsS -o /dev/null \
              "$url/_cluster/health?wait_for_status=yellow&timeout=30s" \
              2>/dev/null || true
            echo "bootstrap $label: PUT /deces"
            curl -fsS -X PUT "$url/deces" \
              -H 'Content-Type: application/json' \
              --data-binary @/usr/local/share/deces/mapping.json \
              > "$REPORTS_DIR/bootstrap-$label.put.json"
            # Wait for the freshly-PUT `deces` index to have its
            # primary shard active before we bulk-load against it.
            curl -fsS -o /dev/null \
              "$url/_cluster/health/deces?wait_for_status=yellow&wait_for_active_shards=1&timeout=30s" \
              2>/dev/null || true
            echo "bootstrap $label: POST /_bulk (10k docs)"
            gunzip -c /usr/local/share/deces/slice-10000.ndjson.gz \
              | curl -fsS -X POST "$url/_bulk" \
                  -H 'Content-Type: application/x-ndjson' \
                  --data-binary @- \
                  > "$REPORTS_DIR/bootstrap-$label.bulk.json"
            # Refresh so newly indexed docs are searchable before
            # the load phase starts.
            curl -fsS -X POST "$url/deces/_refresh" \
              > "$REPORTS_DIR/bootstrap-$label.refresh.json"
          }
          bootstrap_engine "$SURCH_URL" surch
          bootstrap_engine "$OPENSEARCH_URL" opensearch
          # Warm up both engines so JVM JIT + page caches are hot
          # before artillery_bench measures cold-start outliers
          # (OpenSearch phase-1 max would otherwise spike above
          # SLO_ARTILLERY_MAX_MS = 500 ms).
          warmup_engine() {
            url="$1"; label="$2"
            echo "warmup $label: 50 match_all hits"
            for i in $(seq 1 50); do
              curl -fsS -o /dev/null -X POST "$url/deces/_search" \
                -H 'Content-Type: application/json' \
                -d '{"query":{"match_all":{}},"size":5}' \
                || true
            done
          }
          warmup_engine "$SURCH_URL" surch
          warmup_engine "$OPENSEARCH_URL" opensearch
          # The bench driver image ships artillery_bench and
          # bench_report in /usr/local/bin.
          /usr/local/bin/artillery_bench \
            --url "$SURCH_URL" --index "deces" \
            --names "$INSEE_DIR/artillery_names.txt" \
            --workers "$ART_WORKERS" --phases "$ART_PHASES" \
            --report "$REPORTS_DIR/art-surch.json"
          /usr/local/bin/artillery_bench \
            --url "$OPENSEARCH_URL" --index "deces" \
            --names "$INSEE_DIR/artillery_names.txt" \
            --workers "$ART_WORKERS" --phases "$ART_PHASES" \
            --report "$REPORTS_DIR/art-os.json"
          /usr/local/bin/bench_report \
            --dir "$REPORTS_DIR" \
            --output "$REPORTS_DIR/summary.md"
          wait_rss_sample "$REPORTS_DIR/.rss-surch.pid"
          wait_rss_sample "$REPORTS_DIR/.rss-os.pid"
          # Surface each rss-*.json envelope between markers so the
          # ci-k8s workflow can reconstruct them when the emptyDir
          # /reports volume is gone after driver termination.
          for f in "$REPORTS_DIR"/rss-art-*.json; do
            [ -f "$f" ] || continue
            fname="$(basename "$f")"
            echo "BEGIN_SURCH_K8S_RSS_FILE:$fname"
            cat "$f"
            echo
            echo "END_SURCH_K8S_RSS_FILE:$fname"
          done
          echo "BEGIN_SURCH_K8S_SUMMARY"
          cat "$REPORTS_DIR/summary.md"
          echo "END_SURCH_K8S_SUMMARY"
          echo "insee-bench complete."
        command:
        - /bin/sh
        - -c
