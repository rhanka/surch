        securityContext:
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/opensearch/data
          name: scratch
          subPath: opensearch-data
      nodeSelector:
        k8s.scaleway.com/pool-name: burst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccount: surch
      serviceAccountName: surch
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      tolerations:
