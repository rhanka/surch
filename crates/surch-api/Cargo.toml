[package]
name = "surch-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
surch-analysis = { path = "../surch-analysis" }
surch-index = { path = "../surch-index" }
surch-search = { path = "../surch-search" }
surch-types = { path = "../surch-types" }
# Track A wp-a-perf-followups.md Lot 1.7: jemalloc returns freed
# heap pages to the OS aggressively when paired with the
# MALLOC_CONF tuning shipped in the Dockerfile (dirty_decay_ms=0,
# muzzy_decay_ms=0). The glibc default keeps freed bulk
# PostingsBuilder pages mapped without memory pressure (run
# `26359069219`: only 268 MiB recovered out of ~1 GiB freed).
# Linux-only because tikv-jemalloc-sys does not build on the
# musl-on-distroless target reliably; the runtime image is
# `gcr.io/distroless/cc-debian12` (glibc Linux), so this is safe.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tower-http = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }

[dev-dependencies]
opensearch-oracle = { path = "../opensearch-oracle" }
matchid-replay = { path = "../matchid-replay" }
surch-codec = { path = "../surch-codec" }
tower = { workspace = true, features = ["util"] }
tar = { workspace = true }
flate2 = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Real S3 wire-contract tests: MinIO testcontainer replaces the
# in-process axum mock for the `_snapshot/s3` round-trip. The mock
# could not speak AWS Flexible Checksums + STREAMING-UNSIGNED-PAYLOAD-
# TRAILER + ListObjectsV2 XML schema; MinIO does.
testcontainers = { version = "0.27", default-features = false }
testcontainers-modules = { version = "0.15", features = ["minio"] }

# Criterion bench harness: measures the in-process scoring hot path
# (no axum, no HTTP) so iterative search-side optimisations can be
# compared with sub-millisecond resolution. See docs/ops/perf-bench.md.
[[bench]]
name = "search_hot_path"
harness = false

# Phase 1 measurement bench: JSON vs FoR-encoded postings on a
# synthetic 100-doc index. Replaces the wire-up that
# `for-integration-plan.md` originally proposed under `snapshot.rs` —
# the ES-parity snapshot path is currently document-NDJSON, not
# postings, so we ship the gain as a measurement rather than a wire
# change. See `crates/surch-api/benches/snapshot_size.rs` header.
[[bench]]
name = "snapshot_size"
harness = false
