[package]
name = "surch-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
surch-analysis = { path = "../surch-analysis" }
surch-index = { path = "../surch-index" }
surch-search = { path = "../surch-search" }
surch-types = { path = "../surch-types" }
# C2: dense id maps use an FST for uid -> doc_id (kills the ~1.36M per-uid
# Arc<str>). Same fst version as surch-index (workspace-pinned 0.4).
fst = { workspace = true }
# Track A wp-a-perf-followups.md Lot 1.7: jemalloc returns freed
# heap pages to the OS aggressively when paired with the
# MALLOC_CONF tuning shipped in the Dockerfile (dirty_decay_ms=0,
# muzzy_decay_ms=0). The glibc default keeps freed bulk
# PostingsBuilder pages mapped without memory pressure (run
# `26359069219`: only 268 MiB recovered out of ~1 GiB freed).
# Linux-only because tikv-jemalloc-sys does not build on the
# musl-on-distroless target reliably; the runtime image is
# `gcr.io/distroless/cc-debian12` (glibc Linux), so this is safe.
#
# `libc` est ajoute pour `posix_fallocate` (P1 mmap restore) — appel
# direct sur `RawFd` pour pre-allouer 64 MiB de `source.dat` en une
# extent contigue ext4, ce qui evite l'extension repetee pwrite par
# pwrite (cause confirmee du timeout 58 min sur mmap M1.1 — cf.
# docs/paper/memory-campaign-blocker.md §"Diagnostic"). Linux-only par
# coherence avec le module `source_store` Linux : sur macOS/Windows
# dev, on retombe sur le fallback in-RAM `Vec<Option<Vec<u8>>>`.
[target.'cfg(target_os = "linux")'.dependencies]
# Lot C Phase 0b : `features = ["stats"]` compile jemalloc avec
# `--enable-stats` (OFF par defaut : le build sortait `--disable-stats`,
# `stats: 0`) pour que `tikv-jemalloc-ctl` puisse lire les compteurs
# internes (allocated / active / resident / retained / mapped) et les
# exposer en gauges Prometheus. But : expliquer le gap heap anonyme
# (~1,5-2 GiB non attribues aux structures d'index comptees par
# `stats::set_gauges`).
tikv-jemallocator = { version = "0.6", features = ["stats"] }
# `tikv-jemalloc-ctl` lit les stats via `mallctl`. Meme version majeure
# 0.6 que `tikv-jemallocator` pour partager le meme `tikv-jemalloc-sys`
# (une seule copie => feature `stats` unifiee sur le build C). La feature
# `stats` est OBLIGATOIRE ici : le module `tikv_jemalloc_ctl::stats` est
# gate `#[cfg(feature = "stats")]`, il n'existe pas sans elle.
# Lot C Phase 1 : purge explicite post-`_refresh`. `tikv-jemalloc-ctl`
# 0.6.1 n'expose AUCUN binding (sur ni sous) capable d'appeler le
# mallctl `arena.<i>.purge` : ce mallctl est un "pur call" cote C
# (handler `NEITHER_READ_NOR_WRITE()` dans jemalloc/src/ctl.c), qui
# EPERM tout appel ou oldp/oldlenp/newp ne sont pas NULL / newlen != 0
# — or `raw::read*`/`write*`/`update*` du crate ctl fixent TOUJOURS un
# pointeur non-NULL local (meme pour `T=()`). Deja resolu de facon
# transitive (dependance de `tikv-jemallocator` ET `tikv-jemalloc-ctl`,
# meme version 0.6.1) : le declarer en direct ne fait qu'exposer le
# binding FFI `mallctl` deja genere par son build script (qui gere le
# bon nom de symbole selon prefixage jemalloc), sans reecrire
# l'`extern "C"` a la main (fragile). Pas de feature requise : on
# n'utilise que le coeur `mallctl`, pas le sous-module `stats`.
tikv-jemalloc-sys = { version = "0.6" }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
libc = "0.2"
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tower-http = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
# [source 2b] compression zstd PAR-DOC du `_source` (cf.
# docs/paper/contre-expertise-2b-source-2026-07-10.md, section D) : le
# socle deflate/flate2 existant (`SourceBlob::Compressed`,
# `compact_after_refresh`) est dead-code depuis `mmap M1` ; zstd est une
# dependance neuve, utilisee UNIQUEMENT dans le hot path
# `upsert_document_deferred`/`parse_source_blob` de `state.rs`, pas
# workspace-pinnee car aucun autre crate n'en a besoin.
zstd = "0.13"

[dev-dependencies]
opensearch-oracle = { path = "../opensearch-oracle" }
matchid-replay = { path = "../matchid-replay" }
surch-codec = { path = "../surch-codec" }
tower = { workspace = true, features = ["util"] }
tar = { workspace = true }
flate2 = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Real S3 wire-contract tests: MinIO testcontainer replaces the
# in-process axum mock for the `_snapshot/s3` round-trip. The mock
# could not speak AWS Flexible Checksums + STREAMING-UNSIGNED-PAYLOAD-
# TRAILER + ListObjectsV2 XML schema; MinIO does.
testcontainers = { version = "0.27", default-features = false }
testcontainers-modules = { version = "0.15", features = ["minio"] }

# Criterion bench harness: measures the in-process scoring hot path
# (no axum, no HTTP) so iterative search-side optimisations can be
# compared with sub-millisecond resolution. See docs/ops/perf-bench.md.
[[bench]]
name = "search_hot_path"
harness = false

# Phase 1 measurement bench: JSON vs FoR-encoded postings on a
# synthetic 100-doc index. Replaces the wire-up that
# `for-integration-plan.md` originally proposed under `snapshot.rs` —
# the ES-parity snapshot path is currently document-NDJSON, not
# postings, so we ship the gain as a measurement rather than a wire
# change. See `crates/surch-api/benches/snapshot_size.rs` header.
[[bench]]
name = "snapshot_size"
harness = false
